services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /spec/chatbot-api.yaml
    volumes:
      - ./api/src/main/resources/openapi/chatbot-api.yaml:/spec/chatbot-api.yaml:ro

  # HU-30: Vector database exclusiva del chatbot (separada de la BD del monolito)
  postgres-pgvector:
    image: pgvector/pgvector:pg17
    container_name: chatbot-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-net

  # HU-38: DynamoDB Local para registrar cada prompt-response del chatbot
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: chatbot-dynamodb
    restart: unless-stopped
    user: root
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - chatbot-net

  # Crea la tabla al levantar (se ejecuta una vez y termina)
  dynamodb-init:
    image: amazon/aws-cli
    container_name: chatbot-dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-chatbot-interacciones}
    entrypoint: ["/bin/sh", "/init/crear-tabla.sh"]
    volumes:
      - ./db/dynamodb:/init:ro
    networks:
      - chatbot-net

volumes:
  pgvector-data:
  dynamodb-data:

networks:
  chatbot-net:
    name: chatbot-net
