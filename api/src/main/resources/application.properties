spring.application.name=chatbot-api
server.port=8081

# Respuestas JSON con charset UTF-8 explicito (tildes correctas en cualquier cliente)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# HU-38: registro de prompt-response en DynamoDB
chatbot.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
chatbot.dynamodb.tabla=${DYNAMODB_TABLE:chatbot-interacciones}
chatbot.dynamodb.region=us-east-1
chatbot.dynamodb.access-key=local
chatbot.dynamodb.secret-key=local

chatbot.chunking.ruta=../content
chatbot.chunking.max-caracteres=800
chatbot.chunking.solapamiento=100

# HU-33: Vector database y proveedor de embeddings
spring.datasource.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/chatbot_vectors}
spring.datasource.username=${POSTGRES_USER:chatbot}
spring.datasource.password=${POSTGRES_PASSWORD:cambiar}
chatbot.embedding.proveedor=${EMBEDDING_PROVIDER:openai}
chatbot.embedding.modelo=${EMBEDDING_MODEL:}
chatbot.embedding.url=${EMBEDDING_URL:}
chatbot.embedding.api-key=${EMBEDDING_API_KEY:${LLM_API_KEY:}}
chatbot.embedding.dimension=${EMBEDDING_DIMENSION:1536}
chatbot.embedding.timeout-segundos=30

# HU-34: búsqueda por similitud
chatbot.chat.top-k=${CHAT_TOP_K:4}
chatbot.chat.similitud-minima=${CHAT_SIMILITUD_MINIMA:0.30}
